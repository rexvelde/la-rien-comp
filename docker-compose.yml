services:
  mysql:
    image: mysql:8.4
    container_name: la-rien-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: la_rien
      MYSQL_USER: la_rien
      MYSQL_PASSWORD: la_rien_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "la_rien", "-pla_rien_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: la-rien-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/la_rien?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: la_rien
      SPRING_DATASOURCE_PASSWORD: la_rien_password
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: la-rien-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql-data:
